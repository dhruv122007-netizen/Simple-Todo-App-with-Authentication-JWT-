<html>
    <head>
        <script src="https://cdn.jsdelivr.net/npm/axios@1.20.0/dist/axios.min.js"></script>
    </head>
    <body>
        <div style="display: flex; justify-content: space-between; padding: 10px;">
            <div id = "notes">
                Loading....
            </div>
            <div>
                <input type="text" id="userNote">
                <button onclick="addTodos()">Create a New Note</button>
            </div>
        </div>
        <script>
            async function addTodos() {
                await axios.post("http://localhost:3000/notes", {
                    note: document.getElementById("userNote").value
                })
               
                const noteNode = document.createElement("div");
                noteNode.innerHTML = document.getElementById("userNote").value;
                noteNode.setAttribute("style", "border: 2px solid black; padding: 10px")
                document.getElementById("notes").appendChild(noteNode);

                document.getElementById("userNote").value = "";

            }

            async function getTodos() {
                const response = await axios.get("http://localhost:3000/notes");
                const notes = response.data.notes;

                document.getElementById("notes").innerHTML = "";
                for(let i = 0; i < notes.length; i++) {
                    const noteNote = document.createElement("div");
                    noteNote.innerHTML = notes[i];
                    noteNote.setAttribute("style", "border: 2px solid black; padding: 10px")
                    document.getElementById("notes").appendChild(noteNote);
                }
            }
            getTodos();
        </script>
    </body>
</html>
